<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Agent Chat</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #e2e5eb;
    --accent: #2457d6; --accent-text: #ffffff; --me: #e8efff; --bot: #f1f2f5;
    --ok: #1f8a4c; --bad: #c0392b; --code: #f4f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e8ee; --muted: #9aa3b5; --line: #2b313d;
      --accent: #6d93ff; --accent-text: #0d1220; --me: #233257; --bot: #232833;
      --ok: #4cc683; --bad: #ff7b6b; --code: #20252f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr); gap: 16px; padding: 16px; height: 100vh; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 auto 0 0; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #login { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #login input { flex: 1 1 140px; }
  #who { color: var(--muted); }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--me); }
  .bot { align-self: flex-start; background: var(--bot); }
  .err { align-self: flex-start; color: var(--bad); }
  form#send { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  form#send input { flex: 1; }
  #debug { flex: 1; overflow: auto; padding: 0 14px 14px; }
  .turn { margin-top: 12px; }
  .turn h2 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { margin: 4px 0 0; background: var(--code); padding: 6px; border-radius: 4px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; padding: 14px; }
</style>
</head>
<body>
<main>
  <section aria-label="Chat">
    <header>
      <h1>Robo Parts BD support</h1>
      <span id="who">Guest</span>
      <button id="logout" hidden>Log out</button>
    </header>
    <form id="login">
      <input id="email" type="email" placeholder="Store account email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary" type="submit">Log in</button>
      <button type="button" id="guest">Chat as guest</button>
    </form>
    <div id="messages" aria-live="polite"></div>
    <form id="send">
      <input id="text" placeholder="Type a message in Bangla or English" autocomplete="off" required>
      <button class="primary" type="submit">Send</button>
    </form>
  </section>

  <section aria-label="Debug panel">
    <header>
      <h1>Debug panel</h1>
      <label>Model <select id="model"></select></label>
      <label>Channel
        <select id="channel"><option value="chat">Chat</option><option value="voice">Voice</option></select>
      </label>
      <button id="reset">New conversation</button>
    </header>
    <div id="debug"><p class="hint">Each customer turn shows here: model calls, tool calls, and the time of each step.</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;
let turnNo = 0;

async function api(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.message || data.detail || `Request failed (${response.status})`);
  return data;
}

async function newSession() {
  sessionId = (await api("/api/session", { channel: $("channel").value })).session_id;
  turnNo = 0;
  $("messages").innerHTML = "";
  $("debug").innerHTML = '<p class="hint">Each customer turn shows here: model calls, tool calls, and the time of each step.</p>';
  $("who").textContent = "Guest";
  $("logout").hidden = true;
  $("login").hidden = false;
}

function bubble(kind, text) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  div.textContent = text;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

function cell(text, cls) {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  td.textContent = text ?? "";
  return td;
}

function detailsCell(label, content) {
  const td = document.createElement("td");
  if (!content) return td;
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.textContent = label;
  const pre = document.createElement("pre");
  try { pre.textContent = JSON.stringify(JSON.parse(content), null, 2); } catch { pre.textContent = content; }
  d.append(s, pre);
  td.appendChild(d);
  return td;
}

function newTurnTable(model) {
  turnNo += 1;
  const wrap = document.createElement("div");
  wrap.className = "turn";
  wrap.innerHTML = `<h2><span>Turn ${turnNo} · ${model}</span><span class="total"></span></h2>
    <table><thead><tr><th>Step</th><th>Detail</th><th>Input</th><th>Output</th>
    <th class="num">First token ms</th><th class="num">ms</th><th class="num">Tokens/s</th></tr></thead><tbody></tbody></table>`;
  $("debug").appendChild(wrap);
  $("debug").scrollTop = $("debug").scrollHeight;
  return wrap;
}

function addRow(wrap, cells) {
  const tr = document.createElement("tr");
  cells.forEach((c) => tr.appendChild(c));
  wrap.querySelector("tbody").appendChild(tr);
  $("debug").scrollTop = $("debug").scrollHeight;
}

async function send(text) {
  bubble("me", text);
  const reply = bubble("bot", "…");
  let answer = "";
  let wrap = null;
  const pending = {};
  const response = await fetch("/api/chat", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: text, model: $("model").value, channel: $("channel").value }),
  });
  if (!response.ok) {
    reply.remove();
    bubble("err", (await response.json().catch(() => ({}))).detail || "The chat request failed.");
    return;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      if (!part.startsWith("data: ")) continue;
      const e = JSON.parse(part.slice(6));
      const d = e.data;
      if (e.type === "turn_start") wrap = newTurnTable(d.model);
      if (e.type === "text") { answer += d.text; reply.textContent = answer; }
      if (e.type === "llm_end") {
        addRow(wrap, [cell(`Model call ${d.round}`), cell(d.tokens ? `${d.tokens} tokens` : ""), cell(""), cell(""),
          cell(d.first_token_ms, "num"), cell(d.ms, "num"), cell(d.tokens_per_s, "num")]);
      }
      if (e.type === "tool_start") pending[d.name] = d.arguments;
      if (e.type === "tool_end") {
        addRow(wrap, [cell("Tool"), cell(d.name, d.ok ? "ok" : "bad"), detailsCell("input", pending[d.name]),
          detailsCell(d.ok ? "output" : "error", d.content), cell(""), cell(d.ms, "num"), cell("")]);
      }
      if (e.type === "answer") {
        reply.textContent = d.text || answer;
        wrap.querySelector(".total").textContent = `Turn total ${(d.total_ms / 1000).toFixed(2)} s`;
      }
      if (e.type === "error") {
        reply.remove();
        bubble("err", d.message);
        if (wrap) wrap.querySelector(".total").textContent = "Error";
      }
    }
  }
}

$("login").addEventListener("submit", async (event) => {
  event.preventDefault();
  try {
    const data = await api("/api/login", { session_id: sessionId, email: $("email").value, password: $("password").value });
    $("who").textContent = `Logged in as ${data.first_name}`;
    $("login").hidden = true;
    $("logout").hidden = false;
    $("password").value = "";
  } catch (error) { bubble("err", error.message); }
});
$("guest").addEventListener("click", () => { $("login").hidden = true; $("text").focus(); });
$("logout").addEventListener("click", async () => { await api("/api/logout", { session_id: sessionId }); await newSession(); });
$("reset").addEventListener("click", newSession);
$("send").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  $("text").disabled = true;
  try { await send(text); } finally { $("text").disabled = false; $("text").focus(); }
});

(async () => {
  const data = await fetch("/api/models").then((r) => r.json());
  const names = data.models.length ? data.models : [data.default];
  for (const name of names) {
    const option = new Option(name, name, false, name === data.default);
    $("model").appendChild(option);
  }
  await newSession();
})();
</script>
</body>
</html>
