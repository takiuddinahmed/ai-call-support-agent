# Product search by need, in each language (8 cases)
- id: search-en-esp32
  language: en
  login: none
  channel: chat
  turns:
    - user: Do you have an ESP32 board with Wi-Fi?
      expect:
        tools_called: [search_products]
        answer_contains_any: ["{live:price:esp32-devkit-v1}", "{live:price:esp32-s3-devkitc}"]
- id: search-en-5v-distance
  language: en
  login: none
  channel: chat
  turns:
    - user: I need a distance sensor that works at 5V for my robot.
      expect:
        tools_called: [search_products]
        answer_contains_any: [HC-SR04, VL53L0X]
- id: search-en-i2c-display
  language: en
  login: none
  channel: chat
  turns:
    - user: Which display can I connect over I2C?
      expect:
        tools_called: [search_products]
        answer_contains_any: [SSD1306, 16x2]
- id: search-en-motor-driver
  language: en
  login: none
